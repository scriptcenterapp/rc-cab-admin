<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<title>RC Campus Life Events App Admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="https://rccampusapp-admin.vercel.app/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="https://rccampusapp-admin.vercel.app/favicon-16.png" />
<link rel="icon" type="image/png" href="https://rccampusapp-admin.vercel.app/favicon-512.png" />
<link rel="apple-touch-icon" sizes="180x180" href="https://rccampusapp-admin.vercel.app/apple-touch-icon.png" />
<!-- Works at both entry points: rceventplanning.com/appadmin (SSO from the
     planner, same-origin) and rccampusapp-admin.vercel.app (direct login). -->

<style>
  /* Self-host Inter so non-Apple devices get Inter instead of Segoe UI/Roboto.
     Relative URL resolves same-origin whether direct or proxied under /appadmin. */
  /* Absolute host URL so it loads at both entry points (proxied /appadmin and
     the direct .vercel.app). Cross-origin under the proxy, so vercel.json sends
     Access-Control-Allow-Origin for the font. */
  @font-face { font-family: 'Inter'; src: url('https://rccampusapp-admin.vercel.app/Inter.ttf') format('truetype'); font-weight: 100 900; font-display: swap; font-style: normal; }
  :root {
    --maroon: #6E2639;
    --maroon-dark: #5a1f2f;
    --rose: #a83c5a;
    --bg: #f6f1f1;
    --card: #ffffff;
    --surface2: #faf5f5;
    --line: #ece4e5;
    --text: #221418;
    --muted: #6d6165;
    --faint: #9a9095;
    --gold: #b98a2e;
    --danger: #c0392b;
    --ok: #2f8f5b;
    --radius: 16px;
    --shadow: 0 1px 3px rgba(34,20,24,.05), 0 14px 40px rgba(34,20,24,.06);
    --glass: rgba(255,255,255,0.82);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  /* macOS control feel: springy press + brand focus ring */
  button { font-family: inherit; cursor: pointer; transition: transform .12s cubic-bezier(.34,1.56,.64,1), filter .15s ease; -webkit-tap-highlight-color: transparent; }
  button:active:not(:disabled) { transform: scale(.96); }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(168,60,90,.32); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  input, select, textarea {
    font-family: inherit; font-size: 15px; width: 100%;
    padding: 11px 13px; border: 1px solid var(--line); border-radius: 11px;
    background: #fff; color: var(--text); transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--maroon); box-shadow: 0 0 0 3px rgba(168,60,90,.22); }
  textarea { resize: vertical; min-height: 78px; }
  label { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); margin: 0 0 6px; }
  .field { margin-bottom: 14px; }
  .row { display: flex; gap: 12px; }
  .row > .field { flex: 1; }
  .check { display: flex; align-items: center; gap: 9px; }
  .check input { width: auto; }
  .check label { margin: 0; color: var(--text); font-size: 15px; font-weight: 500; }

  .btn {
    border: none; border-radius: 11px; padding: 11px 17px; font-size: 14.5px; font-weight: 600;
    background: linear-gradient(180deg, #7a2c42, var(--maroon)); color: #fff;
    box-shadow: 0 1px 2px rgba(34,20,24,.18);
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--line); box-shadow: none; }
  .btn.danger { background: var(--danger); box-shadow: 0 1px 2px rgba(192,57,43,.25); }
  .btn.ghost { background: transparent; color: var(--maroon); padding: 8px 10px; box-shadow: none; }
  .btn.sm { padding: 8px 13px; font-size: 13px; }

  /* Login */
  #login { min-height: 100dvh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(60% 50% at 82% -10%, rgba(110,38,57,.10), transparent 70%),
                radial-gradient(52% 46% at -10% 112%, rgba(168,60,90,.09), transparent 70%), var(--bg); }
  #login .card { width: 100%; max-width: 400px; background: var(--glass); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 24px 60px rgba(34,20,24,.14); padding: 34px 28px; }
  #login .brand { text-align: center; margin-bottom: 22px; }
  #login .brand .mark { display: inline-flex; align-items: center; background: var(--maroon); border-radius: 16px; padding: 13px 22px; margin-bottom: 16px; box-shadow: 0 10px 26px rgba(110,38,57,.30); }
  #login .brand .mark img { height: 30px; width: auto; display: block; }
  #login h1 { font-size: 21px; font-weight: 600; letter-spacing: -.3px; margin: 0; }
  #login p.sub { color: var(--muted); font-size: 14px; margin: 5px 0 0; }

  /* App shell */
  #app { display: none; min-height: 100dvh; }
  .topbar { position: sticky; top: 0; z-index: 5; }
  /* Menu bar — mirrors the Event Planner: maroon gradient, logo + glass pill tabs, account pill */
  .menubar { height: 48px; background: linear-gradient(180deg, #7a2c42, var(--maroon)); color: #fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 1px 0 rgba(0,0,0,.24), 0 6px 18px -8px rgba(34,20,24,.4); }
  /* Full-width bar — this app has many tabs, so use the whole width (content below stays centered). */
  .mb-inner { max-width: none; margin: 0 auto; height: 100%; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .mb-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
  .mb-logo { display: flex; align-items: center; flex-shrink: 0; }
  .mb-logo img { height: 30px; width: auto; display: block; }
  .mb-div { width: 1px; height: 20px; background: rgba(255,255,255,.2); flex-shrink: 0; }
  nav.tabs { display: flex; align-items: center; gap: 3px; overflow-x: auto; scrollbar-width: none; min-width: 0; height: 100%; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button { background: transparent; border: none; color: rgba(255,255,255,.8); padding: 7px 15px; font-size: 13.5px; font-weight: 450; border-radius: 999px; white-space: nowrap; transition: background .18s, transform .12s cubic-bezier(.34,1.56,.64,1); }
  nav.tabs button.active { color: #fff; font-weight: 600; background: rgba(255,255,255,.2); box-shadow: inset 0 1px 0 rgba(255,255,255,.42), inset 0 -1px 3px rgba(0,0,0,.07), 0 2px 6px rgba(0,0,0,.14); }
  .mb-acct { position: relative; flex-shrink: 0; }
  .mb-acct-btn { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.16); border-radius: 999px; padding: 3px 11px 3px 3px; color: #fff; }
  .mb-avatar { width: 27px; height: 27px; border-radius: 999px; background: rgba(255,255,255,.92); color: var(--maroon); display: grid; place-items: center; font-size: 11.5px; font-weight: 600; flex-shrink: 0; }
  .mb-uname { font-size: 13px; font-weight: 450; white-space: nowrap; max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
  .mb-menu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 30; background: var(--glass); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--line); border-radius: 13px; box-shadow: 0 16px 40px rgba(34,20,24,.2); padding: 6px; min-width: 224px; }
  .mb-menu[hidden] { display: none; }
  .mb-menu-head { padding: 7px 10px 9px; border-bottom: 1px solid var(--line); margin-bottom: 4px; font-size: 11px; color: var(--faint); }
  .mb-menu-head b { display: block; color: var(--text); font-weight: 600; font-size: 13.5px; margin: 2px 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mb-menu button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; background: transparent; border: none; border-radius: 9px; padding: 9px 11px; font-size: 13.5px; font-weight: 500; color: var(--text); box-shadow: none; }
  .mb-menu button:hover { background: var(--surface2); filter: none; }
  .mb-menu button.danger-item { color: var(--danger); }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .2px; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.2); }
  .mb-menu .badge { background: #f2e9ec; color: var(--maroon); }

  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 70px; }
  .section-head { display: flex; align-items: center; margin-bottom: 14px; gap: 10px; }
  .section-head h2 { font-size: 21px; font-weight: 600; letter-spacing: -.3px; margin: 0; flex: 1; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; }
  .item { display: flex; align-items: flex-start; gap: 12px; }
  .item .meta { flex: 1; min-width: 0; }
  .item .meta .name { font-weight: 600; font-size: 15.5px; }
  .item .meta .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .item .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: #f2e9ec; color: var(--maroon); margin-left: 6px; vertical-align: middle; }
  .pill.gray { background: var(--surface2); color: var(--muted); }
  .pill.green { background: #e3f5ea; color: var(--ok); }
  .pill.red { background: #fbe7e4; color: var(--danger); }
  .empty { text-align: center; color: var(--faint); padding: 44px 16px; }

  /* Event-list image indicator: poster thumb when present, dashed slot when not */
  .ev-thumb { width: 40px; height: 53px; flex-shrink: 0; border-radius: 7px; object-fit: cover; border: 1px solid var(--line); background: #f0f0f3; }
  .ev-thumb.none { display: grid; place-items: center; border-style: dashed; color: var(--muted); }
  .ev-thumb.none svg { width: 18px; height: 18px; }

  /* Event groups (Upcoming / Previous) */
  .evgroup + .evgroup { margin-top: 24px; }
  .evgroup > h3 { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; letter-spacing: .2px; color: var(--muted); margin: 0 0 10px; }
  .evgroup > h3 .count { font-size: 12px; font-weight: 600; letter-spacing: 0; color: var(--muted); background: var(--surface2); border-radius: 999px; padding: 1px 8px; }
  .evgroup.past .card { opacity: .82; }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(34,20,24,.34); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: none; align-items: flex-start; justify-content: center; padding: 24px 16px; z-index: 20; overflow-y: auto; }
  .overlay.open { display: flex; }
  .modal { background: rgba(255,255,255,.86); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 24px 60px rgba(34,20,24,.3); width: 100%; max-width: 520px; padding: 22px; margin: auto; }
  .modal h3 { margin: 0 0 16px; font-size: 18px; font-weight: 600; letter-spacing: -.2px; }
  .modal .foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

  .msg { font-size: 14px; padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; display: none; }
  .msg.show { display: block; }
  .msg.err { background: #fbe7e4; color: var(--danger); }
  .msg.ok { background: #e3f5ea; color: var(--ok); }

  /* Toast */
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(28,20,24,.82); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); color: #fff; padding: 12px 18px; border-radius: 999px; font-size: 14px; opacity: 0; transition: all .25s; z-index: 50; box-shadow: 0 12px 30px rgba(0,0,0,.3); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Image cropper — event posters are 18×24 (3:4) */
  .crop { margin-top: 10px; }
  .crop-hint { text-align: center; font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .crop-stage { width: 240px; max-width: 100%; margin: 0 auto; touch-action: none; }
  .crop-stage canvas { display: block; width: 240px; height: 320px; border-radius: 10px; background: #f0f0f3; border: 1px solid var(--line); cursor: grab; }
  .crop-stage.dragging canvas { cursor: grabbing; }
  .crop-zoom { display: flex; align-items: center; gap: 10px; max-width: 240px; margin: 10px auto 2px; color: var(--muted); font-size: 14px; }
  .crop-zoom input[type=range] { flex: 1; padding: 0; }
  .crop-actions { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }

  /* ---------- Mobile ---------- */
  @media (max-width: 640px) {
    .mb-inner { padding: 0 12px; }
    .mb-uname { display: none; }
    nav.tabs button { padding: 7px 12px; }

    main { padding: 16px 12px 64px; }
    .section-head h2 { font-size: 19px; }

    /* Stack the two-up form fields */
    .row { flex-direction: column; gap: 0; }

    /* List rows: action buttons wrap under the text, full width */
    .item { flex-wrap: wrap; }
    .item .actions { width: 100%; justify-content: flex-end; margin-top: 8px; }
    .item .actions .btn { flex: 1; }

    /* Bulk toolbar wraps cleanly */
    #bulkBar { flex-wrap: wrap; }
    #bulkBar #delSelected { flex: 1; }

    /* Modals: tighter, stacked full-width footer buttons */
    .overlay { padding: 12px; }
    .modal { padding: 18px 16px; }
    .modal .foot { flex-direction: column-reverse; }
    .modal .foot .btn { width: 100%; }

    /* Comfortable tap targets */
    .btn { padding: 12px 16px; }
    .btn.sm { padding: 9px 13px; font-size: 14px; }
  }
</style>
</head>
<body>

<!-- ===== Login ===== -->
<div id="login">
  <div class="card">
    <div class="brand">
      <div class="mark"><img src="https://rceventplanning.com/se-logo-2.png" alt="Roanoke College Student Engagement" /></div>
      <h1>RC Campus Life Events App Admin</h1>
      <p class="sub">Sign in with your Event Planner account</p>
    </div>
    <div id="loginMsg" class="msg err"></div>
    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn" style="width:100%" id="loginBtn" type="submit">Sign in</button>
    </form>
  </div>
</div>

<!-- ===== App ===== -->
<div id="app">
  <div class="topbar">
    <div class="menubar">
      <div class="mb-inner">
        <div class="mb-left">
          <div class="mb-logo"><img src="https://rceventplanning.com/se-logo-2.png" alt="Roanoke College Student Engagement" /></div>
          <div class="mb-div"></div>
          <nav class="tabs" id="tabs"></nav>
        </div>
        <div class="mb-acct" id="mbAcct">
          <button class="mb-acct-btn" id="acctBtn" title="Account" aria-haspopup="true">
            <span class="mb-avatar" id="acctInitial">?</span>
            <span class="mb-uname" id="whoEmail"></span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="opacity:.72"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="mb-menu" id="acctMenu" hidden>
            <div class="mb-menu-head">Signed in as<b id="acctEmail"></b><span class="badge" id="whoRole"></span></div>
            <button id="changePwBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="color:var(--maroon);flex-shrink:0"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>Change password</button>
            <button id="signOutBtn" class="danger-item"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>Sign out</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <main id="view"></main>
</div>

<!-- ===== Modal host ===== -->
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://tswffszxrhzonaetwldv.supabase.co";
const SUPABASE_KEY = "sb_publishable_UwyRT9kDK9Gi2h2RaWuLPQ_OCAQxfvZ";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// ---------- small helpers ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2600); }
function openModal(html) { $("modal").innerHTML = html; $("overlay").classList.add("open"); }
function closeModal() { $("overlay").classList.remove("open"); $("modal").innerHTML = ""; }
// Dismiss on backdrop press (not click): a text-selection drag that starts inside a
// field and releases on the backdrop fires a click on the overlay — which used to close
// the modal mid-edit. mousedown only matches when the press itself starts on the backdrop.
$("overlay").addEventListener("mousedown", (e) => { if (e.target === $("overlay")) closeModal(); });

// datetime-local <-> ISO (browser local timezone)
function toLocalInput(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 16);
}
function fromLocalInput(v) { return v ? new Date(v).toISOString() : null; }
function fmt(iso, opts) {
  if (!iso) return "—";
  return new Date(iso).toLocaleString([], opts || { dateStyle: "medium", timeStyle: "short" });
}

const KINDS = [
  ["cancelled", "Cancelled"], ["time_change", "Time Changed"], ["location_change", "Location Changed"], ["important", "Important"],
];

// Event categories live in the DB (`categories` table) so they can be edited
// without code changes. Loaded after login into appCategories. CATEGORIES_FALLBACK
// is used only if that read fails.
const CATEGORIES_FALLBACK = [
  ["music", "Music"], ["bingo", "Bingo"], ["free_food", "Free Food"], ["movies", "Movies"],
  ["games", "Games & Trivia"], ["sports", "Sports"], ["giveaways", "Giveaways"], ["wellness", "Wellness"],
  ["greek_life", "Greek Life"], ["game_room", "Game Room"], ["sga", "SGA"], ["special", "Special Event"],
];
let appCategories = [];
async function loadCategories() {
  const fb = () => CATEGORIES_FALLBACK.map(([slug, label], i) => ({ slug, label, color: "#7C2529", icon: "star.fill", legacy_category: "special", sort_order: i }));
  try {
    const { data, error } = await sb.from("categories").select("*").order("sort_order", { ascending: true });
    appCategories = (!error && data && data.length) ? data : fb();
  } catch { appCategories = fb(); }
}
const catBySlug = (slug) => appCategories.find((c) => c.slug === slug);
const catLabel = (slug) => (catBySlug(slug) || {}).label || slug;
const catColor = (slug) => (catBySlug(slug) || {}).color || "#999999";

// "Show as" fallback options — the original tags every shipped app version knows.
const LEGACY_OPTS = ["music","bingo","free_food","movies","games","sports","giveaways","wellness","special"];

// Curated SF Symbols for the icon picker, drawn as SF-Symbol-style line icons
// (inline SVG, no web font needed). The symbol NAME is what's stored and rendered
// natively in the iOS app; these are the web stand-ins, tinted like iOS does.
const ICON_SVGS = {
  "music.note": '<path d="M9 18V5l12-2v13"/> <circle cx="6" cy="18" r="3"/> <circle cx="18" cy="16" r="3"/>',
  "square.grid.3x3.fill": '<rect width="18" height="18" x="3" y="3" rx="2"/> <path d="M3 9h18"/> <path d="M3 15h18"/> <path d="M9 3v18"/> <path d="M15 3v18"/>',
  "fork.knife": '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/> <path d="M7 2v20"/> <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
  "popcorn.fill": '<path d="M18 8a2 2 0 0 0 0-4 2 2 0 0 0-4 0 2 2 0 0 0-4 0 2 2 0 0 0-4 0 2 2 0 0 0 0 4"/> <path d="M10 22 9 8"/> <path d="m14 22 1-14"/> <path d="M20 8c.5 0 .9.4.8 1l-2.6 12c-.1.5-.7 1-1.2 1H7c-.6 0-1.1-.4-1.2-1L3.2 9c-.1-.6.3-1 .8-1Z"/>',

// ---------- auth ----------
const PLANNER_LOGIN = "https://rceventplanning.com/api/appadmin-login";
const RC_TOKEN_KEY = "sb-tswffszxrhzonaetwldv-auth-token";
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = $("loginMsg"); msg.classList.remove("show");
  const email = $("email").value.trim(), password = $("password").value;
  $("loginBtn").disabled = true; $("loginBtn").textContent = "Signing in…";
  // 1) Planner login — same account as the Event Planner (works at both entry
  //    points and is reachable even where *.supabase.co is filtered).
  let plannerErr = "";
  try {
    const r = await fetch(PLANNER_LOGIN, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email, password }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.session && j.session.access_token) {
      localStorage.setItem(RC_TOKEN_KEY, JSON.stringify(j.session));
      location.reload();   // boot() picks up the session from localStorage
      return;
    }
    plannerErr = j.error || "";
  } catch (_) { /* planner unreachable — fall through to native auth */ }
  // 2) Native RC Life account (fallback)
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $("loginBtn").disabled = false; $("loginBtn").textContent = "Sign in";
  if (error) { msg.textContent = plannerErr || error.message; msg.classList.add("show"); return; }
  await boot();
});
$("signOutBtn").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });

    <div class="field"><label>New password</label><input id="p_new" type="password" autocomplete="new-password" /></div>
    <div class="field"><label>Confirm new password</label><input id="p_confirm" type="password" autocomplete="new-password" /></div>
    <p style="color:var(--muted);font-size:13px">At least 6 characters. You'll stay signed in.</p>
    <div class="foot"><button class="btn secondary" id="p_cancel">Cancel</button><button class="btn" id="p_save">Update password</button></div>`);
  $("p_cancel").addEventListener("click", closeModal);

async function doChangePassword() {
  const m = $("formMsg"); m.classList.remove("show");
  const np = $("p_new").value, cp = $("p_confirm").value;
  if (np.length < 6) { m.textContent = "Password must be at least 6 characters."; m.classList.add("show"); return; }
  if (np !== cp) { m.textContent = "The two passwords don't match."; m.classList.add("show"); return; }
  $("p_save").disabled = true;
  const { error } = await sb.auth.updateUser({ password: np });
  $("p_save").disabled = false;
  if (error) { m.textContent = error.message; m.classList.add("show"); return; }
  closeModal(); toast("Password updated");
}

// Display label for a stored role ("editor" is shown as "Manager").
const roleLabel = (r) => r === "editor" ? "Manager" : r === "admin" ? "Admin" : (r || "");

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $("login").style.display = ""; $("app").style.display = "none"; return; }
  me.email = session.user.email;
  me.id = session.user.id;
  // determine role — require an explicit Admin or Manager role. Anyone signed in
  // without one (no user_roles row) is denied and signed out, so only real
  // accounts can reach the admin.
  const { data: roleRow } = await sb.from("user_roles").select("role").eq("user_id", session.user.id).maybeSingle();
  const role = roleRow?.role;
  if (role !== "admin" && role !== "editor") {
    await sb.auth.signOut();
    $("login").style.display = ""; $("app").style.display = "none";
    const lm = $("loginMsg");
    if (lm) { lm.textContent = "This account doesn't have access. Ask an admin to grant you access."; lm.classList.add("show"); }
    return;
  }
  me.role = role;
  $("login").style.display = "none"; $("app").style.display = "block";
  $("whoEmail").textContent = (me.email || "").split("@")[0];   // short name in the pill
  $("acctEmail").textContent = me.email;                        // full email in the dropdown
  $("acctInitial").textContent = (me.email || "?").trim().charAt(0).toUpperCase() || "?";
  $("whoRole").textContent = roleLabel(me.role);
  await loadCategories();
  buildTabs();
  activeTab = "events";
  render();
}

function buildTabs() {
  const tabs = me.role === "admin"
    ? [["events", "Events"], ["announcements", "Announcements"], ["info", "Info"], ["categories", "Categories"], ["offseason", "Off-Season"], ["calendar", "Calendar"]]
    : [["events", "Events"]];
  $("tabs").innerHTML = tabs.map(([id, label]) =>
    `<button data-tab="${id}" class="${id === activeTab ? "active" : ""}">${label}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach((b) =>
    b.addEventListener("click", () => { activeTab = b.dataset.tab; buildTabs(); render(); }));
}

function render() {
  if (activeTab === "events") return renderEvents();
  if (activeTab === "announcements") return renderAnnouncements();
  if (activeTab === "info") return renderInfo();
  if (activeTab === "categories") return renderCategories();
  if (activeTab === "offseason") return renderOffSeason();
  if (activeTab === "calendar") return renderCalendar();
  if (activeTab === "team") return renderTeam();
}

// ---------- EVENTS (admins: full; editors: add + edit, no delete) ----------
async function renderEvents() {
  const isAdmin = me.role === "admin";
  const view = $("view");
  view.innerHTML = `<div class="section-head"><h2>Events</h2><button class="btn" id="addEvent">+ Add event</button></div>
    ${isAdmin ? `<div id="bulkBar" class="card" style="display:none; align-items:center; gap:10px; padding:10px 14px">
      <span class="check" style="margin:0"><input type="checkbox" id="selAll" /><label for="selAll" style="margin:0">Select all</label></span>
      <span style="flex:1"></span>
      <button class="btn secondary sm" id="selPast">Select past</button>
      <button class="btn danger sm" id="delSelected" disabled>Delete selected (0)</button>
    </div>` : ""}
    <div id="eventList"><div class="empty">Loading…</div></div>`;
  $("addEvent").addEventListener("click", () => eventForm(null));
  const { data, error } = await sb.from("events").select("*").order("start_date", { ascending: true });
  const list = $("eventList");
  if (error) { list.innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  if (!data.length) { list.innerHTML = `<div class="empty">No events yet. Add the first one.</div>`; return; }
  const now = Date.now();
  const isPast = (ev) => new Date(ev.end_date || ev.start_date).getTime() < now;
  const card = (ev) => `
    <div class="card"><div class="item">
      ${isAdmin ? `<input type="checkbox" class="evsel" data-id="${ev.id}" data-past="${isPast(ev)}" style="width:auto; margin-top:4px" />` : ""}
      ${ev.image_url
        ? `<img class="ev-thumb" src="${esc(ev.image_url)}" alt="" title="Has image" loading="lazy" />`
        : `<div class="ev-thumb none" title="No image" aria-label="No image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.6"/><path d="m21 15-4.5-4.5L7 20"/><line x1="3.5" y1="20.5" x2="20.5" y2="3.5"/></svg></div>`}
      <div class="meta">
        <div class="name">${esc(ev.title)}${ev.is_cancelled ? '<span class="pill red">Cancelled</span>' : ""}${ev.is_featured ? '<span class="pill">Featured</span>' : ""}</div>
        <div class="sub"><span style="display:inline-block;width:9px;height:9px;border-radius:99px;background:${catColor(ev.category_slug || ev.category)};margin-right:5px;vertical-align:middle"></span>${esc(catLabel(ev.category_slug || ev.category))} · ${fmt(ev.start_date)} · ${esc(ev.location)}</div>
      </div>
      <div class="actions">
        <button class="btn secondary sm" data-edit="${ev.id}">Edit</button>
        ${isAdmin ? `<button class="btn danger sm" data-del="${ev.id}">Delete</button>` : ""}
      </div>
    </div></div>`;
  const upcoming = data.filter((ev) => !isPast(ev));   // ascending: soonest first
  const previous = data.filter(isPast).reverse();      // descending: most recent first
  const group = (title, items, cls) => items.length
    ? `<div class="evgroup ${cls}"><h3>${title} <span class="count">${items.length}</span></h3>${items.map(card).join("")}</div>`
    : "";
  list.innerHTML = group("Upcoming", upcoming, "") + group("Previous events", previous, "past");
  list.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => eventForm(data.find((e) => e.id === b.dataset.edit))));

  if (!isAdmin) return;   // editors can add & edit, but not delete

  list.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", () => deleteEvent(data.find((e) => e.id === b.dataset.del))));
  $("bulkBar").style.display = "flex";

  // ---- multi-select / bulk delete ----
  const boxes = () => Array.from(list.querySelectorAll(".evsel"));
  const selectedIds = () => boxes().filter((c) => c.checked).map((c) => c.dataset.id);
  const updateBulk = () => {
    const n = selectedIds().length;
    $("delSelected").disabled = n === 0;
    $("delSelected").textContent = `Delete selected (${n})`;
    $("selAll").checked = n > 0 && n === boxes().length;
  };
  boxes().forEach((c) => c.addEventListener("change", updateBulk));
  $("selAll").addEventListener("change", () => { boxes().forEach((c) => { c.checked = $("selAll").checked; }); updateBulk(); });
  $("selPast").addEventListener("click", () => { boxes().forEach((c) => { c.checked = c.dataset.past === "true"; }); updateBulk(); });
  $("delSelected").addEventListener("click", async () => {
    const ids = selectedIds();
    if (!ids.length) return;
    if (!confirm(`Delete ${ids.length} event${ids.length === 1 ? "" : "s"}? This cannot be undone.`)) return;
    $("delSelected").disabled = true;
    const { error: delErr } = await sb.from("events").delete().in("id", ids);
    if (delErr) { $("delSelected").disabled = false; return toast(delErr.message); }
    toast(`Deleted ${ids.length} event${ids.length === 1 ? "" : "s"}`); renderEvents();
  });
}

  });

  });

// ---------- 18×24 (3:4) poster cropper ----------
const CROP_W = 240, CROP_H = 320;        // on-screen frame (3:4)
const OUT_W = 1080, OUT_H = 1440;        // exported pixels — 18×24 in @ 60dpi (3:4)
const MAX_UPLOAD_BYTES = 1024 * 1024;    // auto-compress the poster to stay under ~1 MB

// Encode a canvas to JPEG under maxBytes: drop quality first, then (last resort)
// shrink the dimensions. Aspect ratio is preserved throughout. Returns the blob
// plus whether/how much it had to compress, for a little feedback toast.
async function encodeUnderLimit(canvas, maxBytes) {
  const toBlob = (c, q) => new Promise((res) => c.toBlob(res, "image/jpeg", q));
  let blob = await toBlob(canvas, 0.9);
  if (blob && blob.size <= maxBytes) return { blob, compressed: false };
  for (const q of [0.8, 0.7, 0.6, 0.5, 0.42]) {
    const b = await toBlob(canvas, q);
    if (b) blob = b;
    if (b && b.size <= maxBytes) return { blob, compressed: true };
  }
  let w = canvas.width, h = canvas.height;
  for (let i = 0; i < 3 && blob && blob.size > maxBytes; i++) {
    w = Math.round(w * 0.8); h = Math.round(h * 0.8);   // 0.8 on both → ratio kept
    const small = document.createElement("canvas");
    small.width = w; small.height = h;
    small.getContext("2d").drawImage(canvas, 0, 0, w, h);
    const b = await toBlob(small, 0.6);
    if (b) blob = b;
  }
  return { blob, compressed: true };
}

function openCropper(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => startCrop(img);
    img.onerror = () => toast("Couldn't read that image.");
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function startCrop(img) {
  const area = $("cropArea");
  $("imgPreviewWrap").style.display = "none";   // hide any existing preview while cropping
  area.style.display = "";
  area.innerHTML = `
    <div class="crop-hint">Drag to reposition · slide to zoom — the frame is your 18×24 poster</div>
    <div class="crop-stage" id="cropStage"><canvas id="cropCanvas" width="${CROP_W}" height="${CROP_H}"></canvas></div>
    <div class="crop-zoom"><span>−</span><input id="cropZoom" type="range" min="1" max="3" step="0.01" value="1" /><span>+</span></div>
    <div class="crop-actions">
      <button type="button" class="btn secondary sm" id="cropCancel">Cancel</button>
      <button type="button" class="btn sm" id="cropApply">Use this crop</button>
    </div>`;

  const canvas = $("cropCanvas"), ctx = canvas.getContext("2d");
  const stage = $("cropStage");
  const base = Math.max(CROP_W / img.width, CROP_H / img.height);   // "cover" the frame at min zoom
  let scale = base;
  let dx = (CROP_W - img.width * scale) / 2;   // top-left of the drawn image, relative to frame
  let dy = (CROP_H - img.height * scale) / 2;

  function draw() {
    const w = img.width * scale, h = img.height * scale;
    dx = Math.min(0, Math.max(CROP_W - w, dx));   // keep the frame fully covered
    dy = Math.min(0, Math.max(CROP_H - h, dy));
    ctx.clearRect(0, 0, CROP_W, CROP_H);
    ctx.drawImage(img, dx, dy, w, h);
  }
  draw();

  // drag to pan
  let dragging = false, lastX = 0, lastY = 0;
  canvas.addEventListener("pointerdown", (ev) => {
    dragging = true; lastX = ev.clientX; lastY = ev.clientY;
    stage.classList.add("dragging"); canvas.setPointerCapture(ev.pointerId);
  });
  canvas.addEventListener("pointermove", (ev) => {
    if (!dragging) return;
    dx += ev.clientX - lastX; dy += ev.clientY - lastY;
    lastX = ev.clientX; lastY = ev.clientY; draw();
  });
  const endDrag = () => { dragging = false; stage.classList.remove("dragging"); };
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);

  // zoom, keeping the frame's center point anchored
  $("cropZoom").addEventListener("input", (ev) => {
    const cx = (CROP_W / 2 - dx) / scale, cy = (CROP_H / 2 - dy) / scale;
    scale = base * parseFloat(ev.target.value);
    dx = CROP_W / 2 - cx * scale; dy = CROP_H / 2 - cy * scale;
    draw();
  });

  $("cropCancel").addEventListener("click", () => {
    area.style.display = "none"; area.innerHTML = "";
    $("f_imgfile").value = "";
    if ($("f_imgurl").value) $("imgPreviewWrap").style.display = "";   // restore the prior image
  });

  $("cropApply").addEventListener("click", async () => {
    const applyBtn = $("cropApply");
    applyBtn.disabled = true; applyBtn.textContent = "Processing…";
    const out = document.createElement("canvas");
    out.width = OUT_W; out.height = OUT_H;
    // the slice of the original image currently under the frame → full export size
    const sx = -dx / scale, sy = -dy / scale, sw = CROP_W / scale, sh = CROP_H / scale;
    out.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, OUT_W, OUT_H);
    const { blob, compressed } = await encodeUnderLimit(out, MAX_UPLOAD_BYTES);
    pendingImage = blob;
    $("imgPreview").src = URL.createObjectURL(blob);
    $("imgPreviewWrap").style.display = "";
    area.style.display = "none"; area.innerHTML = "";
    const kb = Math.round(blob.size / 1024);
    toast(compressed ? `Image compressed to ${kb} KB` : `Image ready (${kb} KB)`);
  });
}

// Uploads a File or a cropped Blob to the public event-images bucket; returns its public URL.
async function uploadImage(file) {
  const type = file.type || "image/jpeg";
  const ext = type.includes("png") ? "png" : type.includes("webp") ? "webp" : "jpg";
  const path = `${crypto.randomUUID()}.${ext}`;
  const { error } = await sb.storage.from("event-images").upload(path, file, { contentType: type, upsert: false });
  if (error) throw error;
  return sb.storage.from("event-images").getPublicUrl(path).data.publicUrl;
}

async function saveEvent(id) {
  const m = $("formMsg"); m.classList.remove("show");
  const title = $("f_title").value.trim();
  const start_date = fromLocalInput($("f_start").value);
  const location = $("f_loc").value.trim();
  if (!title || !start_date || !location) {
    m.textContent = "Title, start time, and location are required."; m.classList.add("show"); return;
  }
  const cropOpen = $("cropArea") && $("cropArea").style.display !== "none";
  if (cropOpen) {
    m.textContent = "Finish the image crop first — tap “Use this crop” or Cancel."; m.classList.add("show"); return;
  }
  $("f_save").disabled = true;
  // Upload the freshly cropped poster; otherwise keep the existing URL (cleared by "Remove image").
  let image_url = $("f_imgurl").value || null;
  if (pendingImage) {
    $("f_save").textContent = "Uploading…";
    try { image_url = await uploadImage(pendingImage); }
    catch (err) {
      $("f_save").disabled = false; $("f_save").textContent = id ? "Save changes" : "Add event";
      m.textContent = "Image upload failed: " + (err.message || err); m.classList.add("show"); return;
    }
    $("f_save").textContent = id ? "Save changes" : "Add event";
  }
  const payload = {
    title,
    description: $("f_desc").value.trim(),
    start_date,
    end_date: fromLocalInput($("f_end").value),
    location,
    category_slug: $("f_cat").value,
    // legacy enum column = a value every shipped app version knows, so old apps never break
    category: (catBySlug($("f_cat").value) || {}).legacy_category || "special",
    host_org: $("f_host").value.trim() || "RC Campus Life",
    image_url,
    silence_notifications: $("f_silence").checked,
  };
  // Featured / cancelled are admin-only controls; editors don't see them, so
  // leave those columns untouched (existing value kept on edit, DB default on add).
  if ($("f_feat")) payload.is_featured = $("f_feat").checked;
  if ($("f_cancelled")) payload.is_cancelled = $("f_cancelled").checked;
  const q = id ? sb.from("events").update(payload).eq("id", id) : sb.from("events").insert(payload);
  const { error } = await q;
  $("f_save").disabled = false;
  if (error) { m.textContent = error.message; m.classList.add("show"); return; }
  closeModal(); toast(id ? "Event updated" : "Event added"); renderEvents();
}

async function deleteEvent(ev) {
  if (!confirm(`Delete "${ev.title}"? This cannot be undone.`)) return;
  const { error } = await sb.from("events").delete().eq("id", ev.id);
  if (error) return toast(error.message);
  toast("Event deleted"); renderEvents();
}

async function saveAnn(id) {
  const m = $("formMsg"); m.classList.remove("show");
  const payload = {
    kind: $("a_kind").value, message: $("a_msg").value.trim(),
    event_id: $("a_event").value || null, expires_at: fromLocalInput($("a_exp").value),
    is_active: $("a_active").checked,
  };
  if (!payload.message) { m.textContent = "Message is required."; m.classList.add("show"); return; }
  $("a_save").disabled = true;
  const q = id ? sb.from("announcements").update(payload).eq("id", id) : sb.from("announcements").insert(payload);
  const { error } = await q;
  $("a_save").disabled = false;
  if (error) { m.textContent = error.message; m.classList.add("show"); return; }
  let pushNote = "";
  if (payload.is_active) {
    const res = await sendAnnouncementPush(kindLabel(payload.kind), payload.message);
    if (res && res.ok) pushNote = ` · pushed to ${res.sent} device${res.sent === 1 ? "" : "s"}`;
    else pushNote = " · push failed";
  }
  closeModal(); toast((id ? "Announcement updated" : "Announcement posted") + pushNote); renderAnnouncements();
}

// Fires a push to all registered devices (admin-only on the server).
// Returns the function's JSON ({ok, sent, devices}) or null so the caller can show a result.
async function sendAnnouncementPush(title, body) {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return null;
    const r = await fetch(`${SUPABASE_URL}/functions/v1/send-announcement-push`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${session.access_token}`, "apikey": SUPABASE_KEY },
      body: JSON.stringify({ title, body }),
    });
    return await r.json();
  } catch (e) { return null; }
}

    if (!$("c_slug").dataset.touched) $("c_slug").value = slugify($("c_label").value);
  });
  $("c_slug").addEventListener("input", () => { $("c_slug").dataset.touched = "1"; });
  $("iconGrid").querySelectorAll(".iconpick").forEach((b) => b.addEventListener("click", () => {
    $("c_icon").value = b.dataset.sf;
    $("iconGrid").querySelectorAll(".iconpick").forEach((x) => { x.style.borderColor = "var(--line)"; x.style.color = "var(--text)"; });
    b.style.borderColor = "var(--maroon)"; b.style.color = "var(--maroon)";
  }));
}
const slugify = (s) => s.toLowerCase().trim().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");

async function saveCategory(existingSlug) {
  const m = $("formMsg"); m.classList.remove("show");
  const label = $("c_label").value.trim();
  const slug = existingSlug || slugify($("c_slug").value);
  if (!label || !slug) { m.textContent = "Name and slug are required."; m.classList.add("show"); return; }
  const row = {
    slug, label, color: $("c_color").value, icon: $("c_icon").value.trim() || "star.fill",
    legacy_category: $("c_legacy").value,
    sort_order: existingSlug ? ((catBySlug(existingSlug) || {}).sort_order ?? 0)
                             : (appCategories.length ? Math.max(...appCategories.map((c) => c.sort_order || 0)) + 1 : 1),
  };
  $("c_save").disabled = true;
  const { error } = await sb.from("categories").upsert(row, { onConflict: "slug" });
  $("c_save").disabled = false;
  if (error) { m.textContent = error.message; m.classList.add("show"); return; }
  closeModal(); toast("Category saved"); renderCategories();
}

async function deleteCategory(slug) {
  const { count } = await sb.from("events").select("id", { count: "exact", head: true }).eq("category_slug", slug);
  const used = count || 0;
  if (!confirm(`Delete "${catLabel(slug)}"?${used ? ` ${used} event(s) use it — they'll fall back to a default style until re-tagged.` : ""}`)) return;
  const { error } = await sb.from("categories").delete().eq("slug", slug);
  if (error) { toast(error.message); return; }
  toast("Category deleted"); renderCategories();
}

async function moveCategory(slug, dir) {
  const i = appCategories.findIndex((c) => c.slug === slug);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= appCategories.length) return;
  const a = appCategories[i], b = appCategories[j];
  await sb.from("categories").update({ sort_order: b.sort_order }).eq("slug", a.slug);
  await sb.from("categories").update({ sort_order: a.sort_order }).eq("slug", b.slug);
  renderCategories();
}

// ---------- CALENDAR (admin) ----------
const MONTHS = [[1,"January"],[2,"February"],[3,"March"],[4,"April"],[5,"May"],[6,"June"],[7,"July"],[8,"August"],[9,"September"],[10,"October"],[11,"November"],[12,"December"]];
async function renderCalendar() {
  const view = $("view");
  view.innerHTML = `<div class="section-head"><h2>Calendar</h2></div><div id="calCard" class="card"><div class="empty">Loading…</div></div>`;
  const { data, error } = await sb.from("app_status").select("*").limit(1).single();
  if (error) { $("calCard").innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  const thisYear = new Date().getFullYear();
  const years = []; for (let y = thisYear - 1; y <= thisYear + 5; y++) years.push(y);
  const monthOpts = (sel) => MONTHS.map(([v, l]) => `<option value="${v}" ${sel == v ? "selected" : ""}>${l}</option>`).join("");
  const yearOpts = (sel) => years.map((y) => `<option value="${y}" ${sel == y ? "selected" : ""}>${y}</option>`).join("");
  const limited = data.calendar_start_year != null && data.calendar_start_month != null;
  $("calCard").innerHTML = `
    <div id="formMsg" class="msg err"></div>
    <p style="margin:0 0 14px;color:var(--muted);font-size:14px">Limit which months people can scroll to in the app's Calendar tab (e.g. the school year). Leave it off to show every month.</p>
    <div class="field check"><input id="cal_limit" type="checkbox" ${limited ? "checked" : ""} /><label for="cal_limit">Limit the calendar to a date range</label></div>
    <div id="calRange" style="${limited ? "" : "display:none"}">
      <div class="row">
        <div class="field"><label>Start month</label><select id="cal_sm">${monthOpts(data.calendar_start_month || 8)}</select></div>
        <div class="field"><label>Start year</label><select id="cal_sy">${yearOpts(data.calendar_start_year || thisYear)}</select></div>
      </div>
      <div class="row">
        <div class="field"><label>End month</label><select id="cal_em">${monthOpts(data.calendar_end_month || 5)}</select></div>
        <div class="field"><label>End year</label><select id="cal_ey">${yearOpts(data.calendar_end_year || thisYear + 1)}</select></div>
      </div>
    </div>
    <button class="btn" id="cal_save" style="width:100%">Save calendar range</button>`;
  $("cal_limit").addEventListener("change", () => { $("calRange").style.display = $("cal_limit").checked ? "" : "none"; });
  $("cal_save").addEventListener("click", saveCalendar);
}
async function saveCalendar() {
  const m = $("formMsg"); m.classList.remove("show");
  let payload;
  if (!$("cal_limit").checked) {
    payload = { calendar_start_year: null, calendar_start_month: null, calendar_end_year: null, calendar_end_month: null };
  } else {
    const sy = +$("cal_sy").value, sm = +$("cal_sm").value, ey = +$("cal_ey").value, em = +$("cal_em").value;
    if (ey * 12 + em < sy * 12 + sm) { m.textContent = "The end month must be the same as or after the start month."; m.classList.add("show"); return; }
    payload = { calendar_start_year: sy, calendar_start_month: sm, calendar_end_year: ey, calendar_end_month: em };
  }
  payload.updated_at = new Date().toISOString();
  $("cal_save").disabled = true;
  const { error } = await sb.from("app_status").update(payload).eq("id", true);
  $("cal_save").disabled = false;
  if (error) { m.textContent = error.message; m.classList.add("show"); return; }
  toast("Calendar range saved"); renderCalendar();
}

// ---------- TEAM (admin) ----------
async function renderTeam() {
  const view = $("view");
  view.innerHTML = `
    <div class="section-head"><h2>Team</h2><button class="btn" id="addUser">+ Add account</button></div>
    <p style="color:var(--muted);font-size:14px;margin:-6px 0 14px">Managers can <strong>only add events</strong>. Admins can manage everything.</p>
    <div id="teamList"><div class="empty">Loading…</div></div>`;
  $("addUser").addEventListener("click", userForm);
  const { data, error } = await sb.rpc("admin_list_users");
  const list = $("teamList");
  if (error) { list.innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  if (!data || !data.length) { list.innerHTML = `<div class="empty">No accounts yet.</div>`; return; }
  list.innerHTML = data.map((u) => `
    <div class="card"><div class="item">
      <div class="meta"><div class="name">${esc(u.email)}<span class="pill ${u.role === "admin" ? "" : "gray"}">${esc(roleLabel(u.role))}</span>${u.user_id === me.id ? '<span class="pill gray">you</span>' : ""}</div>
      <div class="sub">Added ${fmt(u.created_at)}</div></div>
      ${u.user_id === me.id ? "" : `<div class="actions"><button class="btn danger sm" data-deluser="${u.user_id}" data-email="${esc(u.email)}">Remove</button></div>`}
    </div></div>`).join("");
  list.querySelectorAll("[data-deluser]").forEach((b) =>
    b.addEventListener("click", () => deleteUser(b.dataset.deluser, b.dataset.email)));
}
async function deleteUser(userId, email) {
  if (!confirm(`Remove ${email}? They lose access to the admin app immediately. This can't be undone.`)) return;
  const { data: { session } } = await sb.auth.getSession();
  let out;
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-delete-user`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${session.access_token}`, "apikey": SUPABASE_KEY },
      body: JSON.stringify({ user_id: userId }),
    });
    out = await res.json();
  } catch (e) { out = { error: String(e) }; }
  if (!out || out.error) { toast(out?.error || "Could not remove account"); return; }
  toast("Account removed"); renderTeam();
}
function userForm() {
  openModal(`
    <h3>Add account</h3>
    <div id="formMsg" class="msg err"></div>
    <div class="field"><label>Email</label><input id="u_email" type="email" /></div>
    <div class="field"><label>Temporary password</label><input id="u_pass" type="text" placeholder="at least 6 characters" /></div>
    <div class="field"><label>Role</label><select id="u_role"><option value="editor">Manager — can only add events</option><option value="admin">Admin — full access</option></select></div>
    <p style="color:var(--muted);font-size:13px">Share this email + password with the person. They can sign in right away.</p>
    <div class="foot"><button class="btn secondary" id="u_cancel">Cancel</button><button class="btn" id="u_save">Create account</button></div>`);
  $("u_cancel").addEventListener("click", closeModal);
  $("u_save").addEventListener("click", createUser);
}
async function createUser() {
  const m = $("formMsg"); m.classList.remove("show");
  const email = $("u_email").value.trim(), password = $("u_pass").value, role = $("u_role").value;
  if (!email || password.length < 6) { m.textContent = "Enter an email and a password of at least 6 characters."; m.classList.add("show"); return; }
  $("u_save").disabled = true;
  const { data: { session } } = await sb.auth.getSession();
  let out;
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-create-user`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${session.access_token}`, "apikey": SUPABASE_KEY },
      body: JSON.stringify({ email, password, role }),
    });
    out = await res.json();
  } catch (e) { out = { error: String(e) }; }
  $("u_save").disabled = false;
  if (!out || out.error) { m.textContent = out?.error || "Could not create account."; m.classList.add("show"); return; }
  closeModal(); toast("Account created"); renderTeam();
}

// ---------- go ----------
boot();
</script>
