<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<title>Roanoke Campus Events App Admin</title>
<style>
  :root {
    --maroon: #7c2529;
    --maroon-dark: #5e1c20;
    --bg: #f4f4f6;
    --card: #ffffff;
    --line: #e3e3e8;
    --text: #1c1c20;
    --muted: #6b6b74;
    --danger: #c0392b;
    --ok: #1e8e4e;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 6px 18px rgba(0,0,0,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea {
    font-family: inherit; font-size: 15px; width: 100%;
    padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: #fff; color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--maroon); outline-offset: -1px; border-color: var(--maroon); }
  textarea { resize: vertical; min-height: 78px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
  .field { margin-bottom: 14px; }
  .row { display: flex; gap: 12px; }
  .row > .field { flex: 1; }
  .check { display: flex; align-items: center; gap: 9px; }
  .check input { width: auto; }
  .check label { margin: 0; color: var(--text); font-size: 15px; font-weight: 500; }

  .btn {
    border: none; border-radius: 10px; padding: 11px 16px; font-size: 15px; font-weight: 600;
    background: var(--maroon); color: #fff; transition: filter .15s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.secondary { background: #ececef; color: var(--text); }
  .btn.danger { background: var(--danger); }
  .btn.ghost { background: transparent; color: var(--maroon); padding: 8px 10px; }
  .btn.sm { padding: 7px 12px; font-size: 13px; }

  /* Login */
  #login { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
  #login .card { width: 100%; max-width: 380px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 30px 26px; }
  #login .brand { text-align: center; margin-bottom: 22px; }
  #login .brand .mark { width: 54px; height: 54px; border-radius: 50%; background: var(--maroon); color: #fff; display: grid; place-items: center; margin: 0 auto 12px; font-weight: 800; letter-spacing: .5px; }
  #login h1 { font-size: 20px; margin: 0; }
  #login p.sub { color: var(--muted); font-size: 14px; margin: 4px 0 0; }

  /* App shell */
  #app { display: none; min-height: 100dvh; }
  .topbar { position: sticky; top: 0; z-index: 5; }
  header.bar {
    background: var(--maroon); color: #fff; padding: 14px 18px;
    display: flex; align-items: center; gap: 12px;
  }
  header.bar .mark { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.18); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
  header.bar .title { font-weight: 700; font-size: 17px; line-height: 1.1; }
  header.bar .title small { display: block; font-weight: 500; font-size: 12px; opacity: .85; }
  header.bar .spacer { flex: 1; }
  header.bar .who { font-size: 13px; opacity: .9; text-align: right; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,.2); }

  nav.tabs { display: flex; gap: 4px; padding: 0 12px; background: var(--maroon-dark); overflow-x: auto; }
  nav.tabs button { background: transparent; border: none; color: rgba(255,255,255,.78); padding: 13px 14px; font-size: 14px; font-weight: 600; border-bottom: 3px solid transparent; white-space: nowrap; }
  nav.tabs button.active { color: #fff; border-bottom-color: #fff; }

  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
  .section-head { display: flex; align-items: center; margin-bottom: 14px; gap: 10px; }
  .section-head h2 { font-size: 20px; margin: 0; flex: 1; }

  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; }
  .item { display: flex; align-items: flex-start; gap: 12px; }
  .item .meta { flex: 1; min-width: 0; }
  .item .meta .name { font-weight: 700; font-size: 16px; }
  .item .meta .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .item .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #efeaf0; color: var(--maroon); margin-left: 6px; vertical-align: middle; }
  .pill.gray { background: #ececef; color: var(--muted); }
  .pill.green { background: #e3f5ea; color: var(--ok); }
  .pill.red { background: #fbe7e4; color: var(--danger); }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }

  /* Event groups (Upcoming / Previous) */
  .evgroup + .evgroup { margin-top: 24px; }
  .evgroup > h3 { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 0 0 10px; }
  .evgroup > h3 .count { font-size: 12px; font-weight: 700; letter-spacing: 0; text-transform: none; color: var(--muted); background: #ececef; border-radius: 999px; padding: 1px 8px; }
  .evgroup.past .card { opacity: .82; }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-start; justify-content: center; padding: 24px 16px; z-index: 20; overflow-y: auto; }
  .overlay.open { display: flex; }
  .modal { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); width: 100%; max-width: 520px; padding: 22px; margin: auto; }
  .modal h3 { margin: 0 0 16px; font-size: 18px; }
  .modal .foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

  .msg { font-size: 14px; padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; display: none; }
  .msg.show { display: block; }
  .msg.err { background: #fbe7e4; color: var(--danger); }
  .msg.ok { background: #e3f5ea; color: var(--ok); }

  /* Toast */
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1c1c20; color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 14px; opacity: 0; transition: all .25s; z-index: 50; box-shadow: var(--shadow); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Mobile ---------- */
  @media (max-width: 640px) {
    header.bar { flex-wrap: wrap; padding: 12px 14px; gap: 8px 10px; }
    header.bar .mark { width: 32px; height: 32px; font-size: 12px; }
    header.bar .title { font-size: 16px; }
    header.bar .title small { display: none; }
    header.bar .who { font-size: 12px; line-height: 1.15; text-align: right; }
    header.bar .who #whoEmail { max-width: 44vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    header.bar .btn.sm { margin-left: 0 !important; padding: 8px 12px; }

    nav.tabs { padding: 0 8px; }
    nav.tabs button { padding: 12px 12px; }

    main { padding: 16px 12px 64px; }
    .section-head h2 { font-size: 19px; }

    /* Stack the two-up form fields */
    .row { flex-direction: column; gap: 0; }

    /* List rows: action buttons wrap under the text, full width */
    .item { flex-wrap: wrap; }
    .item .actions { width: 100%; justify-content: flex-end; margin-top: 8px; }
    .item .actions .btn { flex: 1; }

    /* Bulk toolbar wraps cleanly */
    #bulkBar { flex-wrap: wrap; }
    #bulkBar #delSelected { flex: 1; }

    /* Modals: tighter, stacked full-width footer buttons */
    .overlay { padding: 12px; }
    .modal { padding: 18px 16px; }
    .modal .foot { flex-direction: column-reverse; }
    .modal .foot .btn { width: 100%; }

    /* Comfortable tap targets */
    .btn { padding: 12px 16px; }
    .btn.sm { padding: 9px 13px; font-size: 14px; }
  }
</style>
</head>
<body>

<!-- ===== Login ===== -->
<div id="login">
  <div class="card">
    <div class="brand">
      <div class="mark">RC</div>
      <h1>Roanoke Campus Events App Admin</h1>
      <p class="sub">Student Engagement</p>
    </div>
    <div id="loginMsg" class="msg err"></div>
    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn" style="width:100%" id="loginBtn" type="submit">Sign in</button>
    </form>
  </div>
</div>

<!-- ===== App ===== -->
<div id="app">
  <div class="topbar">
    <header class="bar">
      <div class="mark">RC</div>
      <div class="title">Roanoke Campus Events App Admin<small>Student Engagement</small></div>
      <div class="spacer"></div>
      <div class="who">
        <div id="whoEmail"></div>
        <span class="badge" id="whoRole"></span>
      </div>
      <button class="btn secondary sm" id="changePwBtn" style="margin-left:10px">Change password</button>
      <button class="btn secondary sm" id="signOutBtn" style="margin-left:6px">Sign out</button>
    </header>
    <nav class="tabs" id="tabs"></nav>
  </div>
  <main id="view"></main>
</div>

<!-- ===== Modal host ===== -->
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://tswffszxrhzonaetwldv.supabase.co";
const SUPABASE_KEY = "sb_publishable_UwyRT9kDK9Gi2h2RaWuLPQ_OCAQxfvZ";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// ---------- small helpers ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2600); }
function openModal(html) { $("modal").innerHTML = html; $("overlay").classList.add("open"); }
function closeModal() { $("overlay").classList.remove("open"); $("modal").innerHTML = ""; }
// Dismiss on backdrop press (not click): a text-selection drag that starts inside a
// field and releases on the backdrop fires a click on the overlay — which used to close
// the modal mid-edit. mousedown only matches when the press itself starts on the backdrop.
$("overlay").addEventListener("mousedown", (e) => { if (e.target === $("overlay")) closeModal(); });

// datetime-local <-> ISO (browser local timezone)
function toLocalInput(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 16);
}
function fromLocalInput(v) { return v ? new Date(v).toISOString() : null; }
function fmt(iso, opts) {
  if (!iso) return "—";
  return new Date(iso).toLocaleString([], opts || { dateStyle: "medium", timeStyle: "short" });
}

const CATEGORIES = [
  ["music", "Music"], ["bingo", "Bingo"], ["free_food", "Free Food"], ["movies", "Movies"],
  ["games", "Games & Trivia"], ["sports", "Sports"], ["giveaways", "Giveaways"], ["wellness", "Wellness"], ["special", "Special Event"],
];
const KINDS = [
  ["cancelled", "Cancelled"], ["time_change", "Time Changed"], ["location_change", "Location Changed"], ["important", "Important"],
];
const catLabel = (v) => (CATEGORIES.find((c) => c[0] === v) || [v, v])[1];
const kindLabel = (v) => (KINDS.find((k) => k[0] === v) || [v, v])[1];

// ---------- session state ----------
let me = { email: "", role: null };
let activeTab = "events";

// ---------- auth ----------
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = $("loginMsg"); msg.classList.remove("show");
  $("loginBtn").disabled = true; $("loginBtn").textContent = "Signing in…";
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  $("loginBtn").disabled = false; $("loginBtn").textContent = "Sign in";
  if (error) { msg.textContent = error.message; msg.classList.add("show"); return; }
  await boot();
});
$("signOutBtn").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });

// ---------- change own password ----------
$("changePwBtn").addEventListener("click", () => {
  openModal(`
    <h3>Change your password</h3>
    <div id="formMsg" class="msg err"></div>
    <div class="field"><label>New password</label><input id="p_new" type="password" autocomplete="new-password" /></div>
    <div class="field"><label>Confirm new password</label><input id="p_confirm" type="password" autocomplete="new-password" /></div>
    <p style="color:var(--muted);font-size:13px">At least 6 characters. You'll stay signed in.</p>
    <div class="foot"><button class="btn secondary" id="p_cancel">Cancel</button><button class="btn" id="p_save">Update password</button></div>`);
  $("p_cancel").addEventListener("click", closeModal);
  $("p_save").addEventListener("click", doChangePassword);
});
async function doChangePassword() {
  const m = $("formMsg"); m.classList.remove("show");
  const np = $("p_new").value, cp = $("p_confirm").value;
  if (np.length < 6) { m.textContent = "Password must be at least 6 characters."; m.classList.add("show"); return; }
  if (np !== cp) { m.textContent = "The two passwords don't match."; m.classList.add("show"); return; }
  $("p_save").disabled = true;
  const { error } = await sb.auth.updateUser({ password: np });
  $("p_save").disabled = false;
  if (error) { m.textContent = error.message; m.classList.add("show"); return; }
  closeModal(); toast("Password updated");
}

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $("login").style.display = ""; $("app").style.display = "none"; return; }
  me.email = session.user.email;
  // determine role
  const { data: roleRow } = await sb.from("user_roles").select("role").eq("user_id", session.user.id).maybeSingle();
  me.role = roleRow?.role || "editor";
  $("login").style.display = "none"; $("app").style.display = "block";
  $("whoEmail").textContent = me.email;
  $("whoRole").textContent = me.role;
  buildTabs();
  activeTab = "events";
  render();
}

function buildTabs() {
  const tabs = me.role === "admin"
    ? [["events", "Events"], ["announcements", "Announcements"], ["offseason", "Off-Season"], ["calendar", "Calendar"], ["team", "Team"]]
    : [["events", "Events"]];
  $("tabs").innerHTML = tabs.map(([id, label]) =>
    `<button data-tab="${id}" class="${id === activeTab ? "active" : ""}">${label}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach((b) =>
    b.addEventListener("click", () => { activeTab = b.dataset.tab; buildTabs(); render(); }));
}

function render() {
  if (activeTab === "events") return renderEvents();
  if (activeTab === "announcements") return renderAnnouncements();
  if (activeTab === "offseason") return renderOffSeason();
  if (activeTab === "calendar") return renderCalendar();
  if (activeTab === "team") return renderTeam();
}

// ---------- EVENTS (admins: full; editors: add + edit, no delete) ----------
async function renderEvents() {
  const isAdmin = me.role === "admin";
  const view = $("view");
  view.innerHTML = `<div class="section-head"><h2>Events</h2><button class="btn" id="addEvent">+ Add event</button></div>
    ${isAdmin ? `<div id="bulkBar" class="card" style="display:none; align-items:center; gap:10px; padding:10px 14px">
      <span class="check" style="margin:0"><input type="checkbox" id="selAll" /><label for="selAll" style="margin:0">Select all</label></span>
      <span style="flex:1"></span>
      <button class="btn secondary sm" id="selPast">Select past</button>
      <button class="btn danger sm" id="delSelected" disabled>Delete selected (0)</button>
    </div>` : ""}
    <div id="eventList"><div class="empty">Loading…</div></div>`;
  $("addEvent").addEventListener("click", () => eventForm(null));
  const { data, error } = await sb.from("events").select("*").order("start_date", { ascending: true });
  const list = $("eventList");
  if (error) { list.innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  if (!data.length) { list.innerHTML = `<div class="empty">No events yet. Add the first one.</div>`; return; }
  const now = Date.now();
  const isPast = (ev) => new Date(ev.end_date || ev.start_date).getTime() < now;
  const card = (ev) => `
    <div class="card"><div class="item">
      ${isAdmin ? `<input type="checkbox" class="evsel" data-id="${ev.id}" data-past="${isPast(ev)}" style="width:auto; margin-top:4px" />` : ""}
      <div class="meta">
        <div class="name">${esc(ev.title)}${ev.is_cancelled ? '<span class="pill red">Cancelled</span>' : ""}${ev.is_featured ? '<span class="pill">Featured</span>' : ""}</div>
        <div class="sub">${esc(catLabel(ev.category))} · ${fmt(ev.start_date)} · ${esc(ev.location)}</div>
      </div>
      <div class="actions">
        <button class="btn secondary sm" data-edit="${ev.id}">Edit</button>
        ${isAdmin ? `<button class="btn danger sm" data-del="${ev.id}">Delete</button>` : ""}
      </div>
    </div></div>`;
  const upcoming = data.filter((ev) => !isPast(ev));   // ascending: soonest first
  const previous = data.filter(isPast).reverse();      // descending: most recent first
  const group = (title, items, cls) => items.length
    ? `<div class="evgroup ${cls}"><h3>${title} <span class="count">${items.length}</span></h3>${items.map(card).join("")}</div>`
    : "";
  list.innerHTML = group("Upcoming", upcoming, "") + group("Previous events", previous, "past");
  list.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => eventForm(data.find((e) => e.id === b.dataset.edit))));

  if (!isAdmin) return;   // editors can add & edit, but not delete

  list.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", () => deleteEvent(data.find((e) => e.id === b.dataset.del))));
  $("bulkBar").style.display = "flex";

  // ---- multi-select / bulk delete ----
  const boxes = () => Array.from(list.querySelectorAll(".evsel"));
  const selectedIds = () => boxes().filter((c) => c.checked).map((c) => c.dataset.id);
  const updateBulk = () => {
    const n = selectedIds().length;
    $("delSelected").disabled = n === 0;
    $("delSelected").textContent = `Delete selected (${n})`;
    $("selAll").checked = n > 0 && n === boxes().length;
  };
  boxes().forEach((c) => c.addEventListener("change", updateBulk));
  $("selAll").addEventListener("change", () => { boxes().forEach((c) => { c.checked = $("selAll").checked; }); updateBulk(); });
  $("selPast").addEventListener("click", () => { boxes().forEach((c) => { c.checked = c.dataset.past === "true"; }); updateBulk(); });
  $("delSelected").addEventListener("click", async () => {
    const ids = selectedIds();
    if (!ids.length) return;
    if (!confirm(`Delete ${ids.length} event${ids.length === 1 ? "" : "s"}? This cannot be undone.`)) return;
    $("delSelected").disabled = true;
    const { error: delErr } = await sb.from("events").delete().in("id", ids);
    if (delErr) { $("delSelected").disabled = false; return toast(delErr.message); }
    toast(`Deleted ${ids.length} event${ids.length === 1 ? "" : "s"}`); renderEvents();
  });
}

function eventForm(ev) {
  const e = ev || {};
  const isAdmin = me.role === "admin";
  openModal(`
    <h3>${ev ? "Edit event" : "Add event"}</h3>
    <div id="formMsg" class="msg err"></div>
    <div class="field"><label>Title</label><input id="f_title" value="${esc(e.title || "")}" /></div>
    <div class="field"><label>Description</label><textarea id="f_desc">${esc(e.description || "")}</textarea></div>
    <div class="row">
      <div class="field"><label>Starts</label><input id="f_start" type="datetime-local" value="${toLocalInput(e.start_date)}" /></div>
      <div class="field"><label>Ends (optional)</label><input id="f_end" type="datetime-local" value="${toLocalInput(e.end_date)}" /></div>
    </div>
    <div class="row">
      <div class="field"><label>Location</label><input id="f_loc" value="${esc(e.location || "")}" /></div>
      <div class="field"><label>Category</label><select id="f_cat">${CATEGORIES.map(([v, l]) => `<option value="${v}" ${e.category === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label>Hosted by</label><input id="f_host" value="${esc(e.host_org || "Roanoke Campus")}" /></div>
    <div class="field">
      <label>Image (optional)</label>
      <div id="imgPreviewWrap" style="${e.image_url ? "" : "display:none"}; margin-bottom:8px">
        <img id="imgPreview" src="${esc(e.image_url || "")}" alt="" style="max-height:130px; border-radius:10px; display:block; border:1px solid var(--line)" />
        <button type="button" class="btn ghost sm" id="imgRemove" style="padding:6px 0">Remove image</button>
      </div>
      <input id="f_imgfile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" />
      <input id="f_imgurl" type="hidden" value="${esc(e.image_url || "")}" />
    </div>
    ${isAdmin ? `<div class="field check"><input id="f_feat" type="checkbox" ${e.is_featured ? "checked" : ""} /><label for="f_feat">Feature on the home screen</label></div>
    <div class="field check"><input id="f_cancelled" type="checkbox" ${e.is_cancelled ? "checked" : ""} /><label for="f_cancelled">Mark as cancelled</label></div>` : ""}
    <div class="foot">
      <button class="btn secondary" id="f_cancel">Cancel</button>
      <button class="btn" id="f_save">${ev ? "Save changes" : "Add event"}</button>
    </div>`);
  $("f_cancel").addEventListener("click", closeModal);
  $("f_save").addEventListener("click", () => saveEvent(ev && ev.id));
  $("f_imgfile").addEventListener("change", () => {
    const f = $("f_imgfile").files?.[0];
    if (f) { $("imgPreview").src = URL.createObjectURL(f); $("imgPreviewWrap").style.display = ""; }
  });
  const imgRemoveBtn = document.getElementById("imgRemove");
  if (imgRemoveBtn) imgRemoveBtn.addEventListener("click", () => {
    $("f_imgurl").value = ""; $("f_imgfile").value = ""; $("imgPreviewWrap").style.display = "none";
  });
}

// Uploads a file to the public event-images bucket; returns its public URL.
async function uploadImage(file) {
  const ext = ((file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "")) || "jpg";
  const path = `${crypto.randomUUID()}.${ext}`;
  const { error } = await sb.storage.from("event-images").upload(path, file, { contentType: file.type || "image/jpeg", upsert: false });
  if (error) throw error;
  return sb.storage.from("event-images").getPublicUrl(path).data.publicUrl;
}

async function saveEvent(id) {
  const m = $("formMsg"); m.classList.remove("show");
  const title = $("f_title").value.trim();
  const start_date = fromLocalInput($("f_start").value);
  const location = $("f_loc").value.trim();
  if (!title || !start_date || !location) {
    m.textContent = "Title, start time, and location are required."; m.classList.add("show"); return;
  }
  $("f_save").disabled = true;
  // Upload a newly chosen image; otherwise keep the existing URL (cleared by "Remove image").
  let image_url = $("f_imgurl").value || null;
  const file = $("f_imgfile").files?.[0];
  if (file) {
    $("f_save").textContent = "Uploading…";
    try { image_url = await uploadImage(file); }
    catch (err) {
      $("f_save").disabled = false; $("f_save").textContent = id ? "Save changes" : "Add event";
      m.textContent = "Image upload failed: " + (err.message || err); m.classList.add("show"); return;
    }
    $("f_save").textContent = id ? "Save changes" : "Add event";
  }
  const payload = {
    title,
    description: $("f_desc").value.trim(),
    start_date,
    end_date: fromLocalInput($("f_end").value),
    location,
    category: $("f_cat").value,
    host_org: $("f_host").value.trim() || "Roanoke Campus",
    image_url,
  };
  // Featured / cancelled are admin-only controls; editors don't see them, so
  // leave those columns untouched (existing value kept on edit, DB default on add).
  if ($("f_feat")) payload.is_featured = $("f_feat").checked;
  if ($("f_cancelled")) payload.is_cancelled = $("f_cancelled").checked;
  const q = id ? sb.from("events").update(payload).eq("id", id) : sb.from("events").insert(payload);
  const { error } = await q;
  $("f_save").disabled = false;
  if (error) { m.textContent = error.message; m.classList.add("show"); return; }
  closeModal(); toast(id ? "Event updated" : "Event added"); renderEvents();
}

async function deleteEvent(ev) {
  if (!confirm(`Delete "${ev.title}"? This cannot be undone.`)) return;
  const { error } = await sb.from("events").delete().eq("id", ev.id);
  if (error) return toast(error.message);
  toast("Event deleted"); renderEvents();
}

// ---------- ANNOUNCEMENTS (admin) ----------
async function renderAnnouncements() {
  const view = $("view");
  view.innerHTML = `<div class="section-head"><h2>Announcements</h2><button class="btn" id="addAnn">+ New announcement</button></div><div id="annList"><div class="empty">Loading…</div></div>`;
  $("addAnn").addEventListener("click", () => annForm(null));
  const { data, error } = await sb.from("announcements").select("*").order("created_at", { ascending: false });
  const list = $("annList");
  if (error) { list.innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  if (!data.length) { list.innerHTML = `<div class="empty">No announcements yet.</div>`; return; }
  list.innerHTML = data.map((a) => `
    <div class="card"><div class="item">
      <div class="meta">
        <div class="name">${esc(kindLabel(a.kind))}${a.is_active ? '<span class="pill green">Active</span>' : '<span class="pill gray">Off</span>'}</div>
        <div class="sub">${esc(a.message)}</div>
        <div class="sub">Posted ${fmt(a.created_at)}${a.expires_at ? " · expires " + fmt(a.expires_at) : ""}</div>
      </div>
      <div class="actions">
        <button class="btn secondary sm" data-toggle="${a.id}">${a.is_active ? "Turn off" : "Turn on"}</button>
        <button class="btn secondary sm" data-edit="${a.id}">Edit</button>
        <button class="btn danger sm" data-del="${a.id}">Delete</button>
      </div>
    </div></div>`).join("");
  list.querySelectorAll("[data-toggle]").forEach((b) => b.addEventListener("click", async () => {
    const a = data.find((x) => x.id === b.dataset.toggle);
    const { error } = await sb.from("announcements").update({ is_active: !a.is_active }).eq("id", a.id);
    if (error) return toast(error.message); toast("Updated"); renderAnnouncements();
  }));
  list.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => annForm(data.find((x) => x.id === b.dataset.edit))));
  list.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", async () => {
    const a = data.find((x) => x.id === b.dataset.del);
    if (!confirm("Delete this announcement?")) return;
    const { error } = await sb.from("announcements").delete().eq("id", a.id);
    if (error) return toast(error.message); toast("Deleted"); renderAnnouncements();
  }));
}

async function annForm(a) {
  const cur = a || {};
  const { data: events } = await sb.from("events").select("id,title,start_date").order("start_date", { ascending: false });
  openModal(`
    <h3>${a ? "Edit announcement" : "New announcement"}</h3>
    <div id="formMsg" class="msg err"></div>
    <div class="field"><label>Type</label><select id="a_kind">${KINDS.map(([v, l]) => `<option value="${v}" ${cur.kind === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    <div class="field"><label>Message</label><textarea id="a_msg">${esc(cur.message || "")}</textarea></div>
    <div class="field"><label>Related event (optional)</label><select id="a_event"><option value="">— none —</option>${(events || []).map((e) => `<option value="${e.id}" ${cur.event_id === e.id ? "selected" : ""}>${esc(e.title)}</option>`).join("")}</select></div>
    <div class="field"><label>Expires (optional)</label><input id="a_exp" type="datetime-local" value="${toLocalInput(cur.expires_at)}" /></div>
    <div class="field check"><input id="a_active" type="checkbox" ${cur.is_active === false ? "" : "checked"} /><label for="a_active">Show in the app now</label></div>
    <div class="foot"><button class="btn secondary" id="a_cancel">Cancel</button><button class="btn" id="a_save">${a ? "Save changes" : "Post announcement"}</button></div>`);
  $("a_cancel").addEventListener("click", closeModal);
  $("a_save").addEventListener("click", () => saveAnn(a && a.id));
}
async function saveAnn(id) {
  const m = $("formMsg"); m.classList.remove("show");
  const payload = {
    kind: $("a_kind").value, message: $("a_msg").value.trim(),
    event_id: $("a_event").value || null, expires_at: fromLocalInput($("a_exp").value),
    is_active: $("a_active").checked,
  };
  if (!payload.message) { m.textContent = "Message is required."; m.classList.add("show"); return; }
  $("a_save").disabled = true;
  const q = id ? sb.from("announcements").update(payload).eq("id", id) : sb.from("announcements").insert(payload);
  const { error } = await q;
  $("a_save").disabled = false;
  if (error) { m.textContent = error.message; m.classList.add("show"); return; }
  let pushNote = "";
  if (payload.is_active) {
    const res = await sendAnnouncementPush(kindLabel(payload.kind), payload.message);
    if (res && res.ok) pushNote = ` · pushed to ${res.sent} device${res.sent === 1 ? "" : "s"}`;
    else pushNote = " · push failed";
  }
  closeModal(); toast((id ? "Announcement updated" : "Announcement posted") + pushNote); renderAnnouncements();
}

// Fires a push to all registered devices (admin-only on the server).
// Returns the function's JSON ({ok, sent, devices}) or null so the caller can show a result.
async function sendAnnouncementPush(title, body) {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return null;
    const r = await fetch(`${SUPABASE_URL}/functions/v1/send-announcement-push`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${session.access_token}`, "apikey": SUPABASE_KEY },
      body: JSON.stringify({ title, body }),
    });
    return await r.json();
  } catch (e) { return null; }
}

// ---------- OFF-SEASON (admin) ----------
async function renderOffSeason() {
  const view = $("view");
  view.innerHTML = `<div class="section-head"><h2>Off-Season</h2></div><div id="osCard" class="card"><div class="empty">Loading…</div></div>`;
  const { data, error } = await sb.from("app_status").select("*").limit(1).single();
  if (error) { $("osCard").innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  const live = data.is_active;
  $("osCard").innerHTML = `
    <div id="formMsg" class="msg err"></div>
    <p style="margin:0 0 14px">Current status:
      <strong style="color:${live ? "var(--ok)" : "var(--danger)"}">${live ? "Live — app is on" : "On break — app shows the break screen"}</strong>
    </p>
    <div class="field check"><input id="os_break" type="checkbox" ${live ? "" : "checked"} /><label for="os_break">Put the app on break (hide events &amp; show the break screen)</label></div>
    <div class="field"><label>Break message</label><textarea id="os_msg" placeholder="We'll see you in August!">${esc(data.return_message || "")}</textarea></div>
    <div class="field"><label>Returns on (optional)</label><input id="os_ret" type="datetime-local" value="${toLocalInput(data.returns_at)}" /></div>
    <button class="btn" id="os_save" style="width:100%">Save status</button>`;
  $("os_save").addEventListener("click", saveOffSeason);
}
async function saveOffSeason() {
  const m = $("formMsg"); m.classList.remove("show");
  const onBreak = $("os_break").checked;
  const payload = {
    is_active: !onBreak,
    return_message: $("os_msg").value.trim() || null,
    returns_at: fromLocalInput($("os_ret").value),
    updated_at: new Date().toISOString(),
  };
  $("os_save").disabled = true;
  const { error } = await sb.from("app_status").update(payload).eq("id", true);
  $("os_save").disabled = false;
  if (error) { m.textContent = error.message; m.classList.add("show"); return; }
  toast("Status saved"); renderOffSeason();
}

// ---------- CALENDAR (admin) ----------
const MONTHS = [[1,"January"],[2,"February"],[3,"March"],[4,"April"],[5,"May"],[6,"June"],[7,"July"],[8,"August"],[9,"September"],[10,"October"],[11,"November"],[12,"December"]];
async function renderCalendar() {
  const view = $("view");
  view.innerHTML = `<div class="section-head"><h2>Calendar</h2></div><div id="calCard" class="card"><div class="empty">Loading…</div></div>`;
  const { data, error } = await sb.from("app_status").select("*").limit(1).single();
  if (error) { $("calCard").innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  const thisYear = new Date().getFullYear();
  const years = []; for (let y = thisYear - 1; y <= thisYear + 5; y++) years.push(y);
  const monthOpts = (sel) => MONTHS.map(([v, l]) => `<option value="${v}" ${sel == v ? "selected" : ""}>${l}</option>`).join("");
  const yearOpts = (sel) => years.map((y) => `<option value="${y}" ${sel == y ? "selected" : ""}>${y}</option>`).join("");
  const limited = data.calendar_start_year != null && data.calendar_start_month != null;
  $("calCard").innerHTML = `
    <div id="formMsg" class="msg err"></div>
    <p style="margin:0 0 14px;color:var(--muted);font-size:14px">Limit which months people can scroll to in the app's Calendar tab (e.g. the school year). Leave it off to show every month.</p>
    <div class="field check"><input id="cal_limit" type="checkbox" ${limited ? "checked" : ""} /><label for="cal_limit">Limit the calendar to a date range</label></div>
    <div id="calRange" style="${limited ? "" : "display:none"}">
      <div class="row">
        <div class="field"><label>Start month</label><select id="cal_sm">${monthOpts(data.calendar_start_month || 8)}</select></div>
        <div class="field"><label>Start year</label><select id="cal_sy">${yearOpts(data.calendar_start_year || thisYear)}</select></div>
      </div>
      <div class="row">
        <div class="field"><label>End month</label><select id="cal_em">${monthOpts(data.calendar_end_month || 5)}</select></div>
        <div class="field"><label>End year</label><select id="cal_ey">${yearOpts(data.calendar_end_year || thisYear + 1)}</select></div>
      </div>
    </div>
    <button class="btn" id="cal_save" style="width:100%">Save calendar range</button>`;
  $("cal_limit").addEventListener("change", () => { $("calRange").style.display = $("cal_limit").checked ? "" : "none"; });
  $("cal_save").addEventListener("click", saveCalendar);
}
async function saveCalendar() {
  const m = $("formMsg"); m.classList.remove("show");
  let payload;
  if (!$("cal_limit").checked) {
    payload = { calendar_start_year: null, calendar_start_month: null, calendar_end_year: null, calendar_end_month: null };
  } else {
    const sy = +$("cal_sy").value, sm = +$("cal_sm").value, ey = +$("cal_ey").value, em = +$("cal_em").value;
    if (ey * 12 + em < sy * 12 + sm) { m.textContent = "The end month must be the same as or after the start month."; m.classList.add("show"); return; }
    payload = { calendar_start_year: sy, calendar_start_month: sm, calendar_end_year: ey, calendar_end_month: em };
  }
  payload.updated_at = new Date().toISOString();
  $("cal_save").disabled = true;
  const { error } = await sb.from("app_status").update(payload).eq("id", true);
  $("cal_save").disabled = false;
  if (error) { m.textContent = error.message; m.classList.add("show"); return; }
  toast("Calendar range saved"); renderCalendar();
}

// ---------- TEAM (admin) ----------
async function renderTeam() {
  const view = $("view");
  view.innerHTML = `
    <div class="section-head"><h2>Team</h2><button class="btn" id="addUser">+ Add account</button></div>
    <p style="color:var(--muted);font-size:14px;margin:-6px 0 14px">Editors can <strong>only add events</strong>. Admins can manage everything.</p>
    <div id="teamList"><div class="empty">Loading…</div></div>`;
  $("addUser").addEventListener("click", userForm);
  const { data, error } = await sb.rpc("admin_list_users");
  const list = $("teamList");
  if (error) { list.innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  if (!data || !data.length) { list.innerHTML = `<div class="empty">No accounts yet.</div>`; return; }
  list.innerHTML = data.map((u) => `
    <div class="card"><div class="item">
      <div class="meta"><div class="name">${esc(u.email)}<span class="pill ${u.role === "admin" ? "" : "gray"}">${esc(u.role)}</span></div>
      <div class="sub">Added ${fmt(u.created_at)}</div></div>
    </div></div>`).join("");
}
function userForm() {
  openModal(`
    <h3>Add account</h3>
    <div id="formMsg" class="msg err"></div>
    <div class="field"><label>Email</label><input id="u_email" type="email" /></div>
    <div class="field"><label>Temporary password</label><input id="u_pass" type="text" placeholder="at least 6 characters" /></div>
    <div class="field"><label>Role</label><select id="u_role"><option value="editor">Editor — can only add events</option><option value="admin">Admin — full access</option></select></div>
    <p style="color:var(--muted);font-size:13px">Share this email + password with the person. They can sign in right away.</p>
    <div class="foot"><button class="btn secondary" id="u_cancel">Cancel</button><button class="btn" id="u_save">Create account</button></div>`);
  $("u_cancel").addEventListener("click", closeModal);
  $("u_save").addEventListener("click", createUser);
}
async function createUser() {
  const m = $("formMsg"); m.classList.remove("show");
  const email = $("u_email").value.trim(), password = $("u_pass").value, role = $("u_role").value;
  if (!email || password.length < 6) { m.textContent = "Enter an email and a password of at least 6 characters."; m.classList.add("show"); return; }
  $("u_save").disabled = true;
  const { data: { session } } = await sb.auth.getSession();
  let out;
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-create-user`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${session.access_token}`, "apikey": SUPABASE_KEY },
      body: JSON.stringify({ email, password, role }),
    });
    out = await res.json();
  } catch (e) { out = { error: String(e) }; }
  $("u_save").disabled = false;
  if (!out || out.error) { m.textContent = out?.error || "Could not create account."; m.classList.add("show"); return; }
  closeModal(); toast("Account created"); renderTeam();
}

// ---------- go ----------
boot();
</script>
